<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>规则怪谈</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #1a1a1a;
      background: #fff;
      width: 280px;
      padding: 16px;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e5e5;
    }

    .section {
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 10px 16px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #f5f5f5;
      border-color: #999;
    }

    .btn-primary {
      background: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }

    .btn-primary:hover {
      background: #333;
    }

    .stats {
      font-size: 12px;
      color: #666;
      padding: 8px 12px;
      background: #fafafa;
      border-radius: 6px;
    }

    .footer {
      font-size: 11px;
      color: #999;
      text-align: center;
      padding-top: 12px;
      border-top: 1px solid #e5e5e5;
    }
  </style>
</head>
<body>
  <h1>规则怪谈</h1>

  <div class="section">
    <div class="section-title">规则管理</div>
    <button id="toggle-sidebar-btn" class="btn btn-primary">展开侧边栏</button>
    <button id="clear-all-btn" class="btn">清空所有规则</button>
  </div>

  <div class="section">
    <div class="section-title">统计</div>
    <div id="stats" class="stats">加载中...</div>
  </div>

  <div class="footer">
    点击页面中的 R 按钮打开侧边栏
  </div>

  <script src="popup.js"></script>
</body>
</html>
